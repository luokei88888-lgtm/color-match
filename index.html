<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>彩珠消消</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 25% 0%, #34206e 0%, transparent 55%),
          radial-gradient(ellipse at 80% 20%, #1c3a6e 0%, transparent 50%),
          linear-gradient(180deg, #1c1245 0%, #0a081f 100%);
        font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        max-width: 480px;
        max-height: 853px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 18px 60px rgba(80, 40, 200, 0.45),
          0 0 0 3px rgba(138, 108, 255, 0.4);
      }
      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
